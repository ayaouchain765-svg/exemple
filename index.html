<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f7f4ff;
            color: #29223d;
        }

        header {
            background: linear-gradient(135deg, #7c5cff, #b56cff);
            color: white;
            text-align: center;
            padding: 70px 20px;
        }

        header h1 {
            font-size: 45px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 19px;
        }

        nav {
            background: white;
            text-align: center;
            padding: 18px;
            box-shadow: 0 2px 10px #ddd;
        }

        nav a {
            color: #7c5cff;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        section {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        h2 {
            text-align: center;
            color: #7c5cff;
            margin-bottom: 25px;
        }

        .cards {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            width: 250px;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px #ddd;
        }

        .card h3 {
            margin-bottom: 10px;
            color: #b056ff;
        }

        .
