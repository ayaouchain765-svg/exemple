<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon site</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3e8ff;
            text-align: center;
        }

        header {
            background: #8b5cf6;
            color: white;
            padding: 60px 20px;
        }

        h1 {
            font-size: 45px;
        }

        .box {
            background: white;
            width: 80%;
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 15px #ccc;
        }

        button {
            background: #8b5cf6;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 16px;
        }

        footer {
            margin-top: 50px;
            background: #222;
            color: white;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Bienvenue 👋</h1>
        <p>Mon premier site avec GitHub</p>
    </header>

    <div class="box">
        <h2>À propos de moi</h2>
        <p>Je suis une étudiante intéressée par le développement web.</p>

        <button>Découvrir</button>
    </div>

    <footer>
        <p>© 2026 Mon Site</p>
    </footer>

</body>
</html>
